syntax = "proto3";

option optimize_for = LITE_RUNTIME;

package proto.file_transfer;

message DriveList
{
    message Item
    {
        enum Type
        {
            TYPE_UNKNOWN        = 0;
            TYPE_CDROM          = 1;
            TYPE_REMOVABLE      = 2;
            TYPE_FIXED          = 3;
            TYPE_REMOTE         = 4;
            TYPE_RAM            = 5;
            TYPE_HOME_FOLDER    = 6;
            TYPE_DESKTOP_FOLDER = 7;
            TYPE_ROOT_DIRECTORY = 8;
        }

        Type type         = 1;
        string path       = 2;
        // Fields 3-5 deprecated.
    }

    repeated Item item = 1;
}

message DriveListRequest
{
    uint32 dummy = 1;
}

message List
{
    message Item
    {
        string name             = 1;
        uint64 size             = 2;
        int64 modification_time = 3;
        bool is_directory       = 4;
    }

    repeated Item item = 1;
}

message ListRequest
{
    string path = 1;
}

message UploadRequest
{
    string path = 1;
    bool overwrite = 2;
}

message DownloadRequest
{
   string path = 1;
}

message PacketRequest
{
    enum Flags
    {
        NO_FLAGS = 0;
        CANCEL   = 1;
    }

    uint32 flags = 1;
}

message Packet
{
    enum Flags
    {
        NO_FLAGS     = 0;
        FIRST_PACKET = 1;
        LAST_PACKET  = 2;

        // |data| is a zstd-compressed chunk rather than the raw bytes. Set per packet: the sender
        // compresses each chunk and keeps it only when it came out smaller, so an incompressible
        // chunk is still sent raw and without this flag. Only sent to a peer that negotiated the
        // "zstd" compression capability, so an older peer never sees it.
        COMPRESSED_ZSTD = 4;
    }

    uint32 flags = 1;
    uint64 file_size = 2;
    bytes data = 3;
}

message CreateDirectoryRequest
{
    string path = 1;
}

message RenameRequest
{
    string old_name = 1;
    string new_name = 2;
}

message RemoveRequest
{
    string path = 1;
}

enum ErrorCode
{
    ERROR_CODE_UNKNOWN             = 0;
    ERROR_CODE_SUCCESS             = 1;
    ERROR_CODE_NO_LOGGED_ON_USER   = 2;
    ERROR_CODE_INVALID_REQUEST     = 3;
    ERROR_CODE_INVALID_PATH_NAME   = 4;
    ERROR_CODE_PATH_NOT_FOUND      = 5;
    ERROR_CODE_PATH_ALREADY_EXISTS = 6;
    ERROR_CODE_NO_DRIVES_FOUND     = 7;
    ERROR_CODE_DISK_FULL           = 8;
    ERROR_CODE_ACCESS_DENIED       = 9;
    ERROR_CODE_FILE_OPEN_ERROR     = 10;
    ERROR_CODE_FILE_CREATE_ERROR   = 11;
    ERROR_CODE_FILE_WRITE_ERROR    = 12;
    ERROR_CODE_FILE_READ_ERROR     = 13;
    ERROR_CODE_DISK_NOT_READY      = 14;

    // A user is logged on, but the session is locked. Reported separately from
    // ERROR_CODE_NO_LOGGED_ON_USER so that the operator can tell whether the computer has to be
    // unlocked or somebody has to log on first.
    ERROR_CODE_USER_SESSION_LOCKED = 15;
}

// Optional features negotiated at the start of a file-transfer session. Sent piggybacked on the
// first normal request (client) and echoed on that request's reply (host): a peer that carries this
// field supports the mechanism, one that does not is an older build and is used as before. There is
// no version gate - the presence of the field IS the signal. See task #21 for the full model.
message FileCapabilities
{
    // Boolean feature names, e.g. "resume", "preserve_timestamps". A name present means supported.
    repeated string features = 1;

    // Compression algorithms this side can both produce and consume, in preference order (e.g.
    // "zstd"). Empty means no compression. A list rather than a bool so lz4/brotli can be added
    // later without a schema change.
    repeated string compression = 2;

    // Integrity algorithms supported, in preference order (e.g. "xxh3", "sha256"). Empty means none.
    repeated string checksum = 3;

    // Largest packet payload (uncompressed) this side will accept, in bytes. 0 means the historical
    // default. The sender uses min(local, peer).
    uint32 max_packet_size = 4;

    // Escape hatch for a future capability that needs a structured payload: a name and an opaque
    // blob parsed only by code that knows the name. Keeps the door open without reserving fields.
    message Extra
    {
        string name = 1;
        bytes data  = 2;
    }
    repeated Extra extra = 5;
}

message Reply
{
    ErrorCode error_code = 1;
    DriveList drive_list = 2;
    List file_list       = 3;
    Packet packet        = 4;

    // Present only on the reply to the request that carried the client's capabilities. Its presence
    // tells the client the host supports the mechanism.
    FileCapabilities capabilities = 5;
}

message Request
{
    DriveListRequest drive_list_request             = 1;
    ListRequest file_list_request                   = 2;
    CreateDirectoryRequest create_directory_request = 3;
    RenameRequest rename_request                    = 4;
    RemoveRequest remove_request                    = 5;
    DownloadRequest download_request                = 6;
    UploadRequest upload_request                    = 7;
    PacketRequest packet_request                    = 8;
    Packet packet                                   = 9;

    // Carried on the first normal request of the session. An older host dispatches on the request
    // above and ignores this field; a new host echoes its own capabilities on the reply.
    FileCapabilities capabilities = 10;
}
